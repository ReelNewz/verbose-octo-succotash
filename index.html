// =========================================================================
// API CLIENT — connects frontend to serverless backend
// =========================================================================
const API = {
  baseUrl: window.location.origin,
  adminToken: () => localStorage.getItem('admin:token') || '',

  async submitIntake(intake) {
    const res = await fetch(this.baseUrl + '/api/intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...intake, source: 'website' })
    });
    if (!res.ok) throw new Error('Intake failed');
    return res.json();
  },

  async adminCall(action, params = {}, method = 'GET', body = null) {
    const token = this.adminToken();
    const query = new URLSearchParams({ action, ...params }).toString();
    const opts = {
      method,
      headers: { 'Authorization': 'Bearer ' + token }
    };
    if (body && method === 'POST') {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(this.baseUrl + '/api/admin-data?' + query, opts);
    if (res.status === 401) { localStorage.removeItem('admin:token'); window.location.reload(); throw new Error('Unauthorized'); }
    if (!res.ok) throw new Error('API error: ' + res.status);
    return res.json();
  },

  listAudits()         { return this.adminCall('list-audits'); },
  getAudit(id)         { return this.adminCall('get-audit', { id }); },
  getMessages(limit=100){ return this.adminCall('messages', { limit }); },
  getActivity(id)      { return this.adminCall('activity', { id }); },
  health()             { return this.adminCall('health'); },

  updateStage(auditId, stage)    { return this.adminCall('update-stage', {}, 'POST', { auditId, stage }); },
  updateNotes(auditId, notes)    { return this.adminCall('update-notes', {}, 'POST', { auditId, notes }); },
  sendEmail(p)                    { return this.adminCall('send-manual-email', {}, 'POST', p); },
  sendSms(p)                      { return this.adminCall('send-manual-sms', {}, 'POST', p); },
  sendProposal(auditId)           { return this.adminCall('send-proposal', {}, 'POST', { auditId }); },
  deleteAudit(auditId)            { return this.adminCall('delete-audit', {}, 'POST', { auditId }); },

  async queryClaude(prompt, model = 'claude-opus-4-5', maxTokens = 1024) {
    const res = await fetch(this.baseUrl + '/api/query-claude', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + this.adminToken()
      },
      body: JSON.stringify({ prompt, model, max_tokens: maxTokens })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Request failed' }));
      throw new Error(err.error || ('HTTP ' + res.status));
    }
    return res.json();
  }
};

const getStatus = (score) => STATUS_MAP.find(s => score <= s.max);

const calculateReadiness = (scores) => {
  let tw = 0, wt = 0;
  DIMENSIONS.forEach(d => { tw += scores[d.id] * d.weight; wt += d.weight; });
  return Math.round(tw / wt);
};

const getTier = (s) => s <= 40 ? "Foundational" : s <= 60 ? "Developing" : s <= 75 ? "Growing" : s <= 90 ? "Optimized" : "Dominant";

const estimateImpact = (intake, readiness) => {
  const leadValue = parseInt(intake.leadValue) || 800;
  const monthlyLeads = parseInt(intake.monthlyLeads) || 40;
  const gap = (100 - readiness) / 100;
  const lostLow = Math.round(monthlyLeads * gap * 0.4);
  const lostHigh = Math.round(lostLow * 1.4);
  const recoveryLow = Math.round(lostLow * leadValue * 0.6);
  const recoveryHigh = Math.round(recoveryLow * 1.4);
  return {
    leadsLostLow: lostLow, leadsLostHigh: lostHigh,
    monthlyRecoveryLow: recoveryLow, monthlyRecoveryHigh: recoveryHigh,
    annualUpliftLow: recoveryLow * 12, annualUpliftHigh: recoveryHigh * 12
  };
};

const fmt = (n) => "$" + n.toLocaleString();
const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const fmtDateTime = (iso) => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtRelative = (iso) => {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  if (diff < 604800000) return Math.floor(diff/86400000) + 'd ago';
  return fmtDate(iso);
};

  const [route, setRoute] = useState(window.location.hash.slice(1) || '/');

    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  return [route, (path) => { window.location.hash = path; }];
};

const AdminAuth = ({ onAuth }) => {
  const [password, setPassword] = useState("");
  const [error, setError] = useState(false);
  const [trying, setTrying] = useState(false);

  const handleSubmit = async () => {
    setTrying(true);
    setError(false);
    localStorage.setItem('admin:token', password);
    try {
      await API.health();
      onAuth(true);
    } catch (e) {
      localStorage.removeItem('admin:token');
      setError(true);
    } finally {
      setTrying(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-6 bg-navy-dark">
      <div className="max-w-md w-full">
        <div className="text-center mb-8"><Logo dark /></div>

          <div className="text-xs tracking-[0.3em] text-gold mb-3 text-center">AGENCY OPERATIONS</div>
          <h1 className="serif text-3xl text-navy font-semibold mb-6 text-center">Admin Access</h1>
          <Field label="Admin Password" type="password" value={password} onChange={setPassword} />
          {error && <div className="text-sm text-red-600 mt-2">Incorrect password</div>}
          <button disabled={trying} onClick={handleSubmit} className="btn-primary w-full py-3 mt-6 serif tracking-wider">
            {trying ? "VERIFYING..." : "ENTER →"}
          </button>
          <div className="text-xs text-gray-mid mt-6 text-center">Set via ADMIN_PASSWORD env var</div>
        </div>
      </div>
    </div>
  );
};

const AdminDashboard = ({ navigate, showToast }) => {
  const [audits, setAudits] = useState([]);
  const [health, setHealth] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const [a, h] = await Promise.all([API.listAudits(), API.health()]);
        setAudits(a.audits || []);
        setHealth(h);
      } catch (e) { showToast('Failed to load: ' + e.message, 'error'); }
      finally { setLoading(false); }
    })();
  }, []);

  const stats = useMemo(() => {
    const total = audits.length;
    const last30 = audits.filter(a => new Date(a.createdAt) > new Date(Date.now() - 30 * 86400000)).length;
    const byStage = {};
    PIPELINE_STAGES.forEach(s => byStage[s.id] = 0);
    audits.forEach(a => { byStage[a.pipelineStage || 'requested'] = (byStage[a.pipelineStage || 'requested'] || 0) + 1; });
    const clients = byStage['client'] || 0;
    const conversionRate = total > 0 ? Math.round((clients / total) * 100) : 0;
    const mrr = clients * 1497;
    const avgScore = total > 0 ? Math.round(audits.filter(a => a.scores).reduce((s, a) => s + calculateReadiness(a.scores), 0) / Math.max(1, audits.filter(a => a.scores).length)) : 0;
    return { total, last30, byStage, clients, conversionRate, mrr, avgScore };
  }, [audits]);

  if (loading) return <div className="p-10"><Spinner /></div>;

  return (
    <div className="p-10">
      <div className="mb-8">
        <div className="text-xs tracking-[0.3em] text-gold mb-2">AGENCY OPERATIONS</div>
        <h1 className="serif text-4xl text-navy font-semibold">Dashboard</h1>
      </div>

      {health && (
        <div className="bg-white border border-gold p-4 mb-6 flex flex-wrap gap-4 text-xs">
          <div className="text-xs tracking-widest text-gold font-semibold">STACK STATUS:</div>
          {Object.entries(health.integrations).map(([k, v]) => (
            <div key={k} className="flex items-center gap-1">
              <span className={"status-dot " + (v ? 'live' : 'failed')}></span>
              <span className="text-navy uppercase tracking-wide">{k}</span>
            </div>
          ))}
        </div>
      )}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
        {[
          { label: "Total Audits", value: stats.total, sub: stats.last30 + " in last 30 days" },
          { label: "Active Clients", value: stats.clients, sub: "$1,497 avg retainer" },
          { label: "Est. MRR", value: fmt(stats.mrr), sub: "from active retainers" },
          { label: "Conversion Rate", value: stats.conversionRate + "%", sub: "audit → client" }
        ].map((s, i) => (
          <div key={i} className="bg-white border border-gold p-6">
            <div className="text-xs tracking-widest text-gold mb-2">{s.label}</div>
            <div className="serif text-4xl font-bold text-navy mb-1">{s.value}</div>
            <div className="text-xs text-gray-mid">{s.sub}</div>
          </div>
        ))}
      </div>

      <div className="grid lg:grid-cols-2 gap-6 mb-10">
        <div className="bg-white border border-gold p-6">
          <div className="text-xs tracking-widest text-gold mb-4">PIPELINE DISTRIBUTION</div>
          <div className="space-y-3">
            {PIPELINE_STAGES.map(stage => {
              const count = stats.byStage[stage.id] || 0;
              const pct = stats.total > 0 ? (count / stats.total) * 100 : 0;
              return (
                <div key={stage.id}>
                  <div className="flex justify-between text-sm mb-1"><span className="text-navy">{stage.name}</span><span className="font-bold text-navy">{count}</span></div>
                  <div className="h-2 bg-gray-100"><div className="h-full" style={{ width: pct + "%", background: stage.color }}></div></div>
                </div>
              );
            })}
          </div>
        </div>
        <div className="bg-white border border-gold p-6">
          <div className="text-xs tracking-widest text-gold mb-4">RECENT AUDITS</div>
          <div className="space-y-2">
            {audits.slice(0, 5).map(a => {
              const r = a.scores ? calculateReadiness(a.scores) : null;
              const stage = PIPELINE_STAGES.find(s => s.id === (a.pipelineStage || 'requested'));
              return (
                <button key={a.id} onClick={() => navigate('/admin/audits/' + a.id)} className="w-full flex items-center gap-3 p-2 hover:bg-gold-soft text-left">
                  <div className="serif text-xl font-bold text-navy w-10">{r || '–'}</div>
                  <div className="flex-1 min-w-0">
                    <div className="serif text-sm text-navy font-semibold truncate">{a.intake.businessName}</div>
                    <div className="text-xs text-gray-mid">{fmtRelative(a.createdAt)}</div>
                  </div>
                  <span className="text-xs px-2 py-0.5 text-white font-bold whitespace-nowrap" style={{ background: stage.color }}>{stage.name}</span>
                </button>
              );
            })}
            {audits.length === 0 && <p className="text-sm text-gray-mid">No audits yet. Submit a test from /audit.</p>}
          </div>
        </div>
      </div>
    </div>
  );
};

const ScoreRing = ({ score, size = 200 }) => {
  const status = getStatus(score);
  const radius = (size - 24) / 2;
  const c = 2 * Math.PI * radius;
  const offset = c - (score / 100) * c;
  return (
    <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="score-ring">
        <circle cx={size/2} cy={size/2} r={radius} stroke="#E8E2D0" strokeWidth="8" fill="none" />
        <circle cx={size/2} cy={size/2} r={radius} stroke={status.color} strokeWidth="8" fill="none" strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1.5s ease-out" }} />
      </svg>
      <div className="absolute text-center"><div className="serif text-5xl font-bold text-navy">{score}</div><div className="text-xs tracking-widest text-gray-mid">/ 100</div></div>
    </div>
  );
};

const AdminAuditDetail = ({ auditId, navigate, showToast }) => {
  const [audit, setAudit] = useState(null);
  const [activity, setActivity] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState("report");
  const [notes, setNotes] = useState("");
  const [showDelete, setShowDelete] = useState(false);
  const [showCustomMsg, setShowCustomMsg] = useState(null);
  const [customSubject, setCustomSubject] = useState("");
  const [customBody, setCustomBody] = useState("");

  const load = async () => {
    try {
      const [a, act] = await Promise.all([API.getAudit(auditId), API.getActivity(auditId)]);
      setAudit(a.audit);
      setActivity(act.activity || []);
      setNotes(a.audit.notes || "");
    } catch (e) { showToast('Failed to load audit', 'error'); }
    finally { setLoading(false); }
  };

  useEffect(() => { load(); }, [auditId]);

  if (loading) return <div className="p-10"><Spinner /></div>;
  if (!audit) return <div className="p-10"><h1 className="serif text-3xl">Audit not found</h1></div>;

  const r = audit.scores ? calculateReadiness(audit.scores) : null;
  const tier = r ? getTier(r) : null;
  const impact = r ? estimateImpact(audit.intake, r) : null;
  const currentStage = PIPELINE_STAGES.find(s => s.id === (audit.pipelineStage || 'requested'));
  const auto = audit.automationStatus || {};

  const updateStage = async (stageId) => {
    try { await API.updateStage(auditId, stageId); showToast("Stage updated"); load(); }
    catch (e) { showToast('Update failed', 'error'); }
  };

  const saveNotes = async () => {
    try { await API.updateNotes(auditId, notes); showToast("Notes saved"); }
    catch (e) { showToast('Save failed', 'error'); }
  };

  const sendProposalAction = async () => {
    if (!confirm("Send the GROWTH-tier proposal email + SMS to " + audit.intake.email + "?")) return;
    try { await API.sendProposal(auditId); showToast("Proposal sent"); load(); }
    catch (e) { showToast('Send failed: ' + e.message, 'error'); }
  };

  const sendAuditNow = async () => {
    if (!audit.scores) { showToast('Audit not yet generated', 'error'); return; }
    if (!confirm("Re-send the audit delivery email to " + audit.intake.email + "?")) return;
    try {
      await API.sendEmail({ auditId, to: audit.intake.email, type: 'audit_delivery' });
      showToast("Audit email sent");
      load();
    } catch (e) { showToast('Send failed', 'error'); }
  };

  const sendCustomEmail = async () => {
    if (!customSubject || !customBody) return;
    try {
      await API.sendEmail({
        auditId, to: audit.intake.email, type: 'custom',
        customSubject, customBody: '<p>' + customBody.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br/>') + '</p>'
      });
      showToast("Email sent");
      setShowCustomMsg(null);
      setCustomSubject(""); setCustomBody("");
      load();
    } catch (e) { showToast('Send failed', 'error'); }
  };

  const sendCustomSms = async () => {
    if (!audit.intake.phone) { showToast('No phone on file', 'error'); return; }
    if (!customBody) return;
    try {
      await API.sendSms({ auditId, to: audit.intake.phone, type: 'custom', customMessage: customBody });
      showToast("SMS sent");
      setShowCustomMsg(null);
      setCustomBody("");
      load();
    } catch (e) { showToast('Send failed', 'error'); }
  };

  const deleteAudit = async () => {
    try { await API.deleteAudit(auditId); showToast('Deleted'); navigate('/admin/audits'); }
    catch (e) { showToast('Delete failed', 'error'); }

const AdminPipeline = ({ navigate, showToast }) => {
  const [audits, setAudits] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dragId, setDragId] = useState(null);

  const load = async () => {
    try { const a = await API.listAudits(); setAudits(a.audits || []); }
    catch (e) { showToast('Failed to load', 'error'); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); }, []);

  const handleDrop = async (stageId) => {
    if (!dragId) return;
    const audit = audits.find(a => a.id === dragId);
    if (audit && audit.pipelineStage !== stageId) {
      try {
        await API.updateStage(dragId, stageId);
        showToast("Moved to " + PIPELINE_STAGES.find(s => s.id === stageId).name);
        load();
      } catch (e) { showToast('Move failed', 'error'); }
    }
    setDragId(null);
  };

  if (loading) return <div className="p-10"><Spinner /></div>;

  const byStage = {};
  PIPELINE_STAGES.forEach(s => byStage[s.id] = []);
  audits.forEach(a => { const st = a.pipelineStage || 'requested'; if (byStage[st]) byStage[st].push(a); });

  return (
    <div className="p-10">
      <div className="mb-8"><div className="text-xs tracking-[0.3em] text-gold mb-2">AGENCY OPERATIONS</div><h1 className="serif text-4xl text-navy font-semibold">Pipeline</h1><p className="text-gray-mid mt-2">Drag cards between stages</p></div>
      <div className="grid grid-cols-3 lg:grid-cols-6 gap-3 overflow-x-auto">
        {PIPELINE_STAGES.map(stage => (
          <div key={stage.id} className="stage-col p-3" onDragOver={(e) => e.preventDefault()} onDrop={() => handleDrop(stage.id)}>
            <div className="mb-3 pb-2 border-b-2" style={{ borderColor: stage.color }}>
              <div className="text-xs font-bold tracking-wider text-white px-2 py-1" style={{ background: stage.color }}>{stage.name}</div>
              <div className="text-xs text-gray-mid mt-1.5 px-1">{byStage[stage.id].length} audit{byStage[stage.id].length !== 1 ? 's' : ''}</div>
            </div>
            <div className="space-y-2 min-h-[300px]">
              {byStage[stage.id].map(a => {
                const r = a.scores ? calculateReadiness(a.scores) : null;
                return (
                  <div key={a.id} className="stage-card p-3" draggable onDragStart={() => setDragId(a.id)} onClick={() => navigate('/admin/audits/' + a.id)}>
                    <div className="flex items-start justify-between mb-1">
                      <div className="serif text-sm font-semibold text-navy leading-tight flex-1">{a.intake.businessName}</div>
                      {r && <div className="serif text-lg font-bold ml-2" style={{ color: getStatus(r).color }}>{r}</div>}
                    </div>
                    <div className="text-xs text-gray-mid">{a.intake.industry}</div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

const AdminPromptLab = ({ showToast }) => {
  const [prompt, setPrompt] = useState("");
  const [model, setModel] = useState("claude-opus-4-5");
  const [maxTokens, setMaxTokens] = useState(1024);
  const [response, setResponse] = useState(null);
  const [usage, setUsage] = useState(null);
  const [loading, setLoading] = useState(false);
  const [history, setHistory] = useState([]);

  const run = async () => {
    if (!prompt.trim()) return;
    setLoading(true);
    setResponse(null);
    try {
      const result = await API.queryClaude(prompt, model, maxTokens);
      setResponse(result.text);
      setUsage(result.usage);
      setHistory(h => [{ prompt, response: result.text, model, at: new Date().toISOString() }, ...h].slice(0, 10));
    } catch (e) {
      showToast('Query failed: ' + e.message, 'error');
    } finally {
      setLoading(false);
    }
  };

  const presets = [
    { label: "Audit prompt test", prompt: "Score the local SEO of a roofing company in Chicago, IL. Output JSON: {\"score\": <0-100>, \"findings\": \"<2 sentences>\", \"recommendation\": \"<1 sentence>\"}" },
    { label: "Email rewrite", prompt: "Rewrite this email to be more direct and outcome-focused while keeping the warm tone:\n\n[paste email here]" },
    { label: "Objection handler", prompt: "A prospect just said: \"$4,997 is too expensive, I need to think about it.\" Write a 3-sentence response that doesn't discount but reframes the math." },
    { label: "Industry research", prompt: "What are the top 3 AI-driven changes affecting [INDUSTRY] in 2026 that local operators don't yet realize are hurting them?" }
  ];

  return (
    <div className="p-10 max-w-5xl">
      <div className="mb-8">
        <div className="text-xs tracking-[0.3em] text-gold mb-2">AGENCY OPERATIONS</div>
        <h1 className="serif text-4xl text-navy font-semibold">Prompt Lab</h1>
        <p className="text-gray-mid mt-2">Live Claude scratchpad — test prompts, draft content, run one-off queries</p>
      </div>

      <div className="grid lg:grid-cols-3 gap-6">
        <div className="lg:col-span-2 bg-white border border-gold p-6">
          <div className="flex flex-wrap gap-2 mb-4">
            {presets.map((p, i) => (
              <button key={i} onClick={() => setPrompt(p.prompt)} className="btn-ghost px-3 py-1.5 text-xs">{p.label}</button>
            ))}
          </div>

          <Textarea label="Prompt" value={prompt} onChange={setPrompt} rows={10} />

          <div className="grid grid-cols-2 gap-3 mt-4">
            <SelectField label="Model" value={model} onChange={setModel} options={[
              "claude-opus-4-5",
              "claude-sonnet-4-5",
              "claude-haiku-4-5"
            ]} />
            <Field label="Max Tokens" value={maxTokens} onChange={v => setMaxTokens(parseInt(v) || 1024)} type="number" />
          </div>

          <button onClick={run} disabled={loading || !prompt.trim()} className="btn-primary w-full py-3 mt-6 tracking-wider serif">
            {loading ? <span className="flex items-center justify-center gap-2"><span className="spinner"></span>QUERYING CLAUDE...</span> : "RUN QUERY →"}
          </button>

          {response && (
            <div className="mt-6 border-t border-gold pt-6">
              <div className="flex justify-between items-center mb-3">
                <div className="text-xs tracking-widest text-gold">RESPONSE</div>
                {usage && (
                  <div className="text-xs text-gray-mid">
                    {usage.input_tokens} in · {usage.output_tokens} out
                  </div>
                )}
              </div>
              <div className="bg-gold-soft border border-gold p-4 whitespace-pre-wrap text-sm text-navy leading-relaxed">{response}</div>
              <button onClick={() => { navigator.clipboard.writeText(response); showToast("Copied"); }} className="btn-ghost px-4 py-2 text-xs tracking-wider mt-3">COPY RESPONSE</button>
            </div>
          )}
        </div>

        <div className="bg-white border border-gold p-6 max-h-[600px] overflow-y-auto">
          <div className="text-xs tracking-widest text-gold mb-3">RECENT QUERIES</div>
          {history.length === 0 ? (
            <p className="text-sm text-gray-mid">Run a query to see history</p>
          ) : (
            <div className="space-y-3">
              {history.map((h, i) => (
                <button key={i} onClick={() => { setPrompt(h.prompt); setResponse(h.response); setModel(h.model); }}
                  className="w-full text-left p-3 bg-gold-soft border border-gray-light hover:border-gold transition">
                  <div className="text-xs text-gold mb-1">{h.model} · {fmtRelative(h.at)}</div>
                  <div className="text-xs text-navy truncate">{h.prompt.slice(0, 80)}</div>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// =========================================================================
// ADMIN: SETTINGS
// =========================================================================
const AdminSettings = ({ showToast }) => {
  const [health, setHealth] = useState(null);
  useEffect(() => { API.health().then(setHealth).catch(()=>{}); }, []);

  return (
    <div className="p-10 max-w-3xl">
      <div className="mb-8"><div className="text-xs tracking-[0.3em] text-gold mb-2">AGENCY OPERATIONS</div><h1 className="serif text-4xl text-navy font-semibold">Settings</h1></div>

      {health && (
        <div className="bg-white border border-gold p-6 mb-4">
          <div className="text-xs tracking-widest text-gold mb-3">AGENCY DETAILS</div>
          <div className="space-y-2 text-sm text-navy">
            <div>Name: <strong>{health.agency.name}</strong></div>
            <div>Email: <strong>{health.agency.email}</strong></div>
          </div>
          <p className="text-xs text-gray-mid mt-3">Update these via Vercel environment variables (AGENCY_NAME, AGENCY_EMAIL, etc.)</p>
        </div>
      )}

      {health && (
        <div className="bg-white border border-gold p-6 mb-4">
          <div className="text-xs tracking-widest text-gold mb-3">INTEGRATION STATUS</div>
          <div className="space-y-2">
            {Object.entries(health.integrations).map(([k, v]) => (
              <div key={k} className="flex items-center justify-between text-sm">
                <span className="text-navy uppercase tracking-wide">{k}</span>
                <span className="flex items-center gap-2">
                  <span className={"status-dot " + (v ? 'live' : 'failed')}></span>
                  <span style={{ color: v ? 'var(--strong)' : 'var(--critical)' }}>{v ? 'CONNECTED' : 'NOT CONFIGURED'}</span>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

// =========================================================================
// ROOT APP
// =========================================================================
function App() {
  const [route, navigate] = useRoute();
  const [adminAuth, setAdminAuth] = useState(false);
  const [toast, setToast] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [submittedAudit, setSubmittedAudit] = useState(null);

  const showToast = (msg, type = 'success') => setToast({ msg, type });

  useEffect(() => {
    const token = localStorage.getItem('admin:token');
    if (token) {
      API.health().then(() => setAdminAuth(true)).catch(() => {
        localStorage.removeItem('admin:token');
      });
    }
  }, []);

  const handleLogout = () => {
    localStorage.removeItem('admin:token');
    setAdminAuth(false);
    navigate('/');
  };

  const handleIntakeSubmit = async (form) => {
    setSubmitting(true);
    try {
      const result = await API.submitIntake(form);
      setSubmittedAudit({ intake: form, id: result.auditId });
      navigate('/audit/confirmation');
    } catch (e) {
      showToast('Submission failed. Check API connection.', 'error');
    } finally { setSubmitting(false); }
  };

  let view;
  if (route === '/') view = <LandingPage navigate={navigate} />;
  else if (route === '/audit') view = <AuditIntake navigate={navigate} onSubmit={handleIntakeSubmit} submitting={submitting} />;
  else if (route === '/audit/confirmation' && submittedAudit) view = <AuditConfirmation navigate={navigate} intake={submittedAudit.intake} auditId={submittedAudit.id} />;
  else if (route.startsWith('/admin')) {
    if (!adminAuth) {
      view = <AdminAuth onAuth={setAdminAuth} />;
    } else {
      let inner;
      if (route === '/admin') inner = <AdminDashboard navigate={navigate} showToast={showToast} />;
      else if (route === '/admin/audits') inner = <AdminAuditsList navigate={navigate} showToast={showToast} />;
      else if (route.startsWith('/admin/audits/')) {
        const id = route.replace('/admin/audits/', '');
        inner = <AdminAuditDetail auditId={id} navigate={navigate} showToast={showToast} />;
      }
      else if (route === '/admin/pipeline') inner = <AdminPipeline navigate={navigate} showToast={showToast} />;
      else if (route === '/admin/inbox') inner = <AdminInbox navigate={navigate} showToast={showToast} />;
      else if (route === '/admin/automation') inner = <AdminAutomation />;
      else if (route === '/admin/prompt-lab') inner = <AdminPromptLab showToast={showToast} />;
      else if (route === '/admin/settings') inner = <AdminSettings showToast={showToast} />;
      else inner = <div className="p-10"><h1 className="serif text-3xl">Page not found</h1></div>;
      view = <AdminLayout navigate={navigate} currentRoute={route} onLogout={handleLogout}>{inner}</AdminLayout>;
    }
  }
  else view = <div className="p-10"><h1 className="serif text-3xl">Page not found</h1><button onClick={() => navigate('/')} className="btn-primary mt-4 px-5 py-2.5">← Home</button></div>;

  return (
    <div className="slide-up">
      {view}
      {toast && <Toast message={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
